name: SP500 Breakout Screener

on:
  schedule:
    # Runs every hour Mon–Fri between 13:00–22:00 UTC (= 9am–6pm ET)
    - cron: '0 13-22 * * 1-5'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --no-cache-dir yfinance pandas numpy tqdm requests

      - name: Run screener
        run: |
          mkdir -p docs
          python advanced_breakout_screener_sp500_v3_4.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Copy output to docs/
        run: |
          mkdir -p docs
          # Disable Jekyll so GitHub Pages serves raw HTML
          touch docs/.nojekyll
          # The script writes sp500_breakout_dashboard.html — copy to docs/index.html
          if [ -f breakout_report.html ]; then
            cp breakout_report.html docs/index.html
          fi

      - name: Commit and push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git add .score_history.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update screener dashboard [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git checkout -- .
          git fetch origin sp500_analyzer
          git rebase origin/sp500_analyzer
          git push
